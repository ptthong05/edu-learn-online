name: EduLearn CI Pipeline

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

jobs:

  # ============================================================
  # 1. BUILD & VALIDATE
  # ============================================================
  build:
    name: Build & Validate
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------
      # CHECKOUT
      # ----------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # NODE.JS
      # ----------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            edu-learn-project/frontend/package-lock.json
            edu-learn-project/backend/package-lock.json

      # ----------------------------------------------------------
      # FRONTEND
      # ----------------------------------------------------------
      - name: Install Frontend Dependencies
        working-directory: ./edu-learn-project/frontend
        run: npm ci

      - name: Build Frontend
        working-directory: ./edu-learn-project/frontend
        run: npm run build

      # ----------------------------------------------------------
      # BACKEND
      # ----------------------------------------------------------
      - name: Install Backend Dependencies
        working-directory: ./edu-learn-project/backend
        run: npm ci


  # ============================================================
  # 2. AUTOMATION TEST
  # ============================================================
  automation-test:
    name: Automation Test
    runs-on: ubuntu-latest
    needs: build

    steps:

      # ----------------------------------------------------------
      # CHECKOUT
      # ----------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # CHECK PROJECT STRUCTURE
      # ----------------------------------------------------------
      - name: Check project structure
        run: |
          echo "========================================"
          echo "CURRENT DIRECTORY"
          echo "========================================"
          pwd

          echo "========================================"
          echo "REPOSITORY"
          echo "========================================"
          ls -la

          echo "========================================"
          echo "EDU LEARN PROJECT"
          echo "========================================"
          ls -la ./edu-learn-project

          echo "========================================"
          echo "AUTOMATION TESTS"
          echo "========================================"

          if [ -d "./automation-tests" ]; then
            echo "automation-tests folder FOUND"
            ls -la ./automation-tests
          else
            echo "ERROR: automation-tests folder NOT FOUND"
            exit 1
          fi

          echo "========================================"
          echo "CURRENT COMMIT"
          echo "========================================"
          git log -1 --oneline


      # ==========================================================
      # NODE.JS
      # ==========================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            edu-learn-project/frontend/package-lock.json
            edu-learn-project/backend/package-lock.json
            automation-tests/package-lock.json


      # ==========================================================
      # BACKEND
      # ==========================================================

      - name: Install Backend Dependencies
        working-directory: ./edu-learn-project/backend
        run: npm ci

      - name: Start Backend
        working-directory: ./edu-learn-project/backend
        run: |
          npm start > backend.log 2>&1 &
          echo $! > backend.pid

      - name: Wait for Backend
        run: |
          echo "Waiting for Backend on port 5000..."

          for i in {1..30}; do
            if curl -s http://localhost:5000 > /dev/null; then
              echo "Backend is ready!"
              exit 0
            fi

            echo "Waiting... ($i/30)"
            sleep 2
          done

          echo "Backend failed to start."

          echo "========================================"
          echo "BACKEND LOG"
          echo "========================================"

          cat ./edu-learn-project/backend/backend.log || true

          exit 1


      # ==========================================================
      # FRONTEND
      # ==========================================================

      - name: Install Frontend Dependencies
        working-directory: ./edu-learn-project/frontend
        run: npm ci

      - name: Build Frontend
        working-directory: ./edu-learn-project/frontend
        run: npm run build

      - name: Start Frontend
        working-directory: ./edu-learn-project/frontend
        run: |
          npm start > frontend.log 2>&1 &
          echo $! > frontend.pid

      - name: Wait for Frontend
        run: |
          echo "Waiting for Frontend on port 3000..."

          for i in {1..30}; do

            if curl -s http://localhost:3000/login > /dev/null; then
              echo "Frontend is ready!"
              exit 0
            fi

            echo "Waiting... ($i/30)"
            sleep 2

          done

          echo "Frontend failed to start."

          echo "========================================"
          echo "FRONTEND LOG"
          echo "========================================"

          cat ./edu-learn-project/frontend/frontend.log || true

          exit 1


      # ==========================================================
      # CODECEPTJS + PLAYWRIGHT
      # ==========================================================

      - name: Install Automation Dependencies
        working-directory: ./automation-tests
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: ./automation-tests
        run: npx playwright install --with-deps chromium


      # ==========================================================
      # RUN AUTOMATION TEST
      # ==========================================================

      - name: Run CodeceptJS Automation Tests
        working-directory: ./automation-tests
        run: npx codeceptjs run --steps
        env:
          DONT_FAIL_ON_EMPTY_RUN: "true"


      # ==========================================================
      # UPLOAD AUTOMATION TEST RESULTS
      # ==========================================================

      - name: Upload Automation Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeceptjs-test-results
          path: ./automation-tests/output
          if-no-files-found: warn


      # ==========================================================
      # UPLOAD SERVER LOGS
      # ==========================================================

      - name: Upload Server Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs
          path: |
            ./edu-learn-project/backend/backend.log
            ./edu-learn-project/frontend/frontend.log
          if-no-files-found: warn
