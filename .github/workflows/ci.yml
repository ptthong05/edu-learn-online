name: EduLearn CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  build:
    name: Build & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & Build Frontend
        working-directory: ./edu-learn-project/frontend
        run: |
          npm install
          npm run build

      - name: Install Backend Dependencies
        working-directory: ./edu-learn-project/backend
        run: |
          npm install

  automation-test:
    name: Automation Test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Automation Dependencies
        working-directory: ./automation-tests
        run: npm install

      - name: Install Playwright
        working-directory: ./automation-tests
        run: npx playwright install --with-deps

      - name: Run CodeceptJS Automation Tests
        working-directory: ./automation-tests
        run: npx codeceptjs run --steps
