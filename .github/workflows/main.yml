name: Node.js Build & Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & Build Frontend
        working-directory: ./edu-learn-project/frontend
        run: |
          npm install
          npm run build

      - name: Install Backend Dependencies
        working-directory: ./edu-learn-project/backend
        run: |
          npm install
