name: ORD-323 Newman API Tests

on:
  push:
    branches:
      - feature/test-automation-nonfunc
  pull_request:
    branches:
      - main

jobs:
  newman-tests:
    name: ${{ matrix.ticket }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - ticket: ORD-325 Authentication
            folder: 1. Authentication (ORD-325)
            report: ORD-325_Newman_Report.html

          - ticket: ORD-326 Courses
            folder: 2. Courses API (ORD-326)
            report: ORD-326_Newman_Report.html

          - ticket: ORD-327 Coupons
            folder: 3. Coupons API (ORD-327)
            report: ORD-327_Newman_Report.html

          - ticket: ORD-328 Orders
            folder: 4. Orders API (ORD-328)
            report: ORD-328_Newman_Report.html

          - ticket: ORD-329 Affiliate
            folder: 5. Affiliate Marketing (ORD-329)
            report: ORD-329_Newman_Report.html

          - ticket: ORD-330 Automation
            folder: 6. Automation - Newman & Environment (ORD-330)
            report: ORD-330_Newman_Report.html

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        working-directory: edu-learn-project/backend
        run: npm ci

      - name: Start backend
        working-directory: edu-learn-project/backend
        run: |
          npm start &
          sleep 8

      - name: Install Newman and HTML reporter
        run: |
          npm install -g newman
          npm install -g newman-reporter-htmlextra

      - name: Run ${{ matrix.ticket }}
        run: |
          mkdir -p newman-reports
          newman run EduLearnOnline.postman_collection.json \
            --folder "${{ matrix.folder }}" \
            -r cli,htmlextra \
            --reporter-htmlextra-export "newman-reports/${{ matrix.report }}"

      - name: Upload ${{ matrix.ticket }} report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.ticket }}-Report
          path: newman-reports/${{ matrix.report }}